<div class="form-page">
  <div class="form-card">
    <h1>{{ isEdit ? 'Edit Student' : 'Add Student' }}</h1>

    <div class="error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-group">
          <label>Student ID *</label>
          <input formControlName="studentId" placeholder="e.g. STU001" />
          <span class="field-error" *ngIf="f['studentId'].touched && f['studentId'].invalid">
            Student ID is required
          </span>
        </div>
        <div class="form-group">
          <label>Full Name *</label>
          <input formControlName="name" placeholder="e.g. John Doe" />
          <span class="field-error" *ngIf="f['name'].touched && f['name'].invalid">
            Name is required
          </span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email *</label>
          <input formControlName="email" type="email" placeholder="e.g. john@example.com" />
          <span class="field-error" *ngIf="f['email'].touched && f['email'].invalid">
            Valid email is required
          </span>
        </div>
        <div class="form-group">
          <label>Department *</label>
          <input formControlName="department" placeholder="e.g. Computer Science" />
          <span class="field-error" *ngIf="f['department'].touched && f['department'].invalid">
            Department is required
          </span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Year *</label>
          <input formControlName="year" type="number" min="1" max="6" placeholder="1–6" />
          <span class="field-error" *ngIf="f['year'].touched && f['year'].invalid">
            Year must be between 1 and 6
          </span>
        </div>
        <div class="form-group">
          <label>GPA</label>
          <input formControlName="gpa" type="number" step="0.01" min="0" max="4" placeholder="0.00–4.00" />
        </div>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input formControlName="phone" placeholder="e.g. +1 555 000 0000" />
      </div>

      <div class="form-actions">
        <a routerLink="/students" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-submit" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}
        </button>
      </div>
    </form>
  </div>
</div>
